## Spring DATASOURCE (override with SPRING_DATASOURCE_* in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/laundryservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Chennai123}


## Hibernate Properties

# Hibernate 7 detects the MySQL dialect from the connection; MySQL5InnoDBDialect no longer exists.

# Hibernate ddl auto (create, create-drop, validate, update)
# Never use create in this environment — it drops all laundry data on startup.
spring.jpa.hibernate.ddl-auto = update

# Keep Jackson 2 JSON conventions (e.g. "mobileNo", "sID") that the Angular UI relies on.
spring.jackson.use-jackson2-defaults=true

# Signs session tokens; set LAUNDRY_AUTH_SECRET in production. Changing it signs everyone out.
laundry.auth.secret=${LAUNDRY_AUTH_SECRET:9f2c7a1e5b8d4f60a3c9e17b2d6f4a8c0e5b7d9a1c3f}

# Comma-separated browser origins allowed to call the API (local ng serve by default).
# Behind Caddy/nginx on one host the UI is same-origin, so this is mainly for local/dev.
laundry.cors.origins=${LAUNDRY_CORS_ORIGINS:http://localhost:4200}

server.port=${SERVER_PORT:9090}
spring.jpa.show-sql=false

file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}
