## Hibernate Properties

# Hibernate 7 detects the MySQL dialect from the connection; MySQL5InnoDBDialect no longer exists.

# Hibernate ddl auto (create, create-drop, validate, update)
# Never use create in this environment — it drops all laundry data on startup.
spring.jpa.hibernate.ddl-auto = update

# Keep Jackson 2 JSON conventions (e.g. "mobileNo", "sID") that the Angular UI relies on.
spring.jackson.use-jackson2-defaults=true

# Signs session tokens; set LAUNDRY_AUTH_SECRET in production. Changing it signs everyone out.
laundry.auth.secret=${LAUNDRY_AUTH_SECRET:9f2c7a1e5b8d4f60a3c9e17b2d6f4a8c0e5b7d9a1c3f}

server.port=9090
spring.jpa.show-sql=false

